name: CI

# Runs on pull requests to main, on release tags, and by hand.
#
# It used to run on tags only, to keep CI spend proportional to releases. That let
# main carry a lint error, a type error and a stale test for months (the lint job
# was red from August to November) and surface only at release time. A full run is
# about 6 billable minutes and the repository is public, so a pull request run is
# cheap; a push to main is not run, because the same commits already ran on their
# pull request. `workflow_dispatch` stays for running the suite on any branch by
# hand.
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, type-check & docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[all,dev,docs]"
      - run: ruff check .
      - run: pyright
      # Catches broken nav/links/mkdocstrings refs at PR time — docs.yml only
      # runs on push to main, which is too late to stop a bad deploy.
      - run: mkdocs build --strict

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[all,dev]"
      - run: python -m pytest -v --cov=byoai --cov-report=term-missing

  build:
    name: Build distribution
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
