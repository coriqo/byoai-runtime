name: Publish to PyPI

on:
  release:
    types: [published]
  # Lets you manually run build+test end to end (Actions tab > this workflow >
  # Run workflow) without cutting a real release. check-version is skipped
  # (there's no release tag to check against) and publish never runs outside
  # a real `release: published` event, so a manual run can't accidentally
  # push a package to PyPI.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-version:
    name: Check version matches release tag
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compare package version to the release tag
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # The version is single-sourced in src/byoai/_version.py (pyproject
          # declares it dynamic); read it from there without importing.
          PKG_VERSION="$(python - <<'PY'
          import re, sys
          match = re.search(r'__version__\s*=\s*"([^"]+)"', open("src/byoai/_version.py").read())
          if match is None:
              sys.exit("could not find __version__ in src/byoai/_version.py")
          print(match.group(1))
          PY
          )"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' (version '${TAG_VERSION}') does not match src/byoai/_version.py version '${PKG_VERSION}'"
            exit 1
          fi

  test:
    # A release cut from a ref with failing tests must not reach PyPI, even
    # though CI already ran on the branch — the release event is the gate.
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[all,dev]"
      - run: python -m pytest

  build:
    name: Build distribution
    needs: [check-version]
    # check-version only runs (and must pass) for a real release; a manual
    # workflow_dispatch run leaves it skipped rather than failed, and build
    # should still go ahead in that case so it's actually testable on demand.
    # Allowlisted, not blocklisted (!= 'failure' alone would also admit a
    # 'cancelled' check-version — e.g. that job hitting its own timeout —
    # since a single needed job's own cancellation doesn't set run-level
    # cancelled()): only 'success' (a real release, check passed) or
    # 'skipped' (workflow_dispatch, nothing to check) let build proceed.
    if: "!cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')"
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish to PyPI
    # success() is explicit, not implicit: a custom if: on a job replaces
    # GitHub's default "only run if needs succeeded" check rather than
    # adding to it, so without this, publish could run even if build/test
    # failed as long as the event was a release. Real releases only — never
    # on a manual workflow_dispatch run, so triggering this workflow by hand
    # to sanity-check the pipeline can never accidentally push to PyPI.
    if: success() && github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build, test]
    environment:
      # Matches the repo's actual environment name (Settings > Environments >
      # "development") — cosmetic only, both GitHub and PyPI match this case-insensitively.
      name: development
      url: https://pypi.org/project/byoai-runtime/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # SHA-pinned (not the mutable release/v1 branch): this step holds OIDC
      # publish rights, so the exact code it runs must be immutable.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
