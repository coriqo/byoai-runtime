[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byoai-runtime"
dynamic = ["version"]
description = "The AI execution runtime for Python. Bring your own infrastructure; ByoAI brings the runtime."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ByoAI Runtime Contributors" }]
keywords = ["ai", "llm", "runtime", "pipeline", "fastapi", "rag", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
]
dependencies = [
    # Upper bound is load-bearing, not defensive habit. Installing this package
    # requires `pip install --pre` while it is an alpha, and --pre applies to
    # every dependency in the resolve, not just this one — so an uncapped
    # `httpx>=0.25` resolves to httpx 1.0.dev*, whose API drops `httpx.Timeout`
    # and breaks the proxy on import. Raise the ceiling only after the code is
    # verified against the 1.x API.
    "httpx>=0.25,<1.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "sse-starlette>=1.6"]
# `cryptography` is not optional here despite living in the `recorder` extra:
# main.py imports ..recorder.proxy_gate at module scope for out-of-mandate
# denial, so the CLI cannot start without it. Installing this extra alone
# produced a `byoai-cache` that raised ModuleNotFoundError on every
# invocation — broken since the proxy gate landed, and never caught because
# nothing installed the built wheel and ran it.
agent-context-cache = [
    "fastapi>=0.100",
    "uvicorn>=0.30",
    "redis>=5.0",
    "cryptography>=42",
]
robyn = ["robyn>=0.60"]
mcp = ["mcp>=1.0"]
flask = ["flask>=3.0"]
perf = ["orjson>=3.9"]
semantic = ["numpy>=1.24"]
redis = ["redis>=5.0"]
pgvector = ["asyncpg>=0.29"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp>=1.20"]
bedrock = ["anthropic[bedrock]>=0.40"]
# Distinct from `bedrock` above, which is Claude-on-Bedrock inference through
# the Anthropic SDK. This one is for ingesting AWS Bedrock *Agent* traces,
# where AWS runs the orchestration loop and boto3 is how we read it back.
bedrock-agent = ["boto3>=1.34"]
vertex = ["anthropic[vertex]>=0.40"]
recorder = ["cryptography>=42", "rfc3161ng>=2.1"]
# What `byoai-shield` needs on top of the base install: it signs the seal chain
# with a device key, so it cannot start without `cryptography`.
shield = ["cryptography>=42"]
# The self-hosted, single-org Shield server: FastAPI + uvicorn to serve it, plus
# `cryptography` (also in `shield`) to sign policy envelopes.
shield-server = ["fastapi>=0.100", "uvicorn>=0.30", "cryptography>=42"]
receipts = ["coriqo-agents[receipts]"]
# `coriqo-mcp`: the MCP interposer. `cryptography` signs its ledger with the
# device key, PyYAML reads a coriqo.mandate.yaml (a JSON mandate needs neither),
# and uvicorn serves --http mode.
coriqo-mcp = ["cryptography>=42", "pyyaml>=6", "uvicorn>=0.30"]
all = ["byoai-runtime[fastapi,robyn,mcp,flask,perf,semantic,redis,pgvector,otel,bedrock,bedrock-agent,vertex,agent-context-cache,shield-server,coriqo-mcp,recorder,shield]"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "build>=1.2",
    "cryptography>=42",
    "rfc3161ng>=2.1",
]

[project.scripts]
byoai = "byoai.cli:main"
byoai-cache = "byoai.agent_context_cache.main:cli"
# Long-form alias kept for backward compatibility.
byoai-agent-context-cache = "byoai.agent_context_cache.main:cli"
coriqo-verify = "byoai.recorder.cli:main"
byoai-recorder-enroll = "byoai.recorder.enroll:enroll_cli"
byoai-recorder-rotate-key = "byoai.recorder.rotation:rotate_cli"
byoai-shield = "byoai.integrations.shield_launcher:main"
byoai-shield-server = "byoai.shield_server.cli:main"
coriqo-mcp = "byoai.integrations.coriqo_mcp:main"

[project.urls]
Homepage = "https://github.com/ravikings/byoai-runtime"
Repository = "https://github.com/ravikings/byoai-runtime"
Documentation = "https://ravikings.github.io/byoai-runtime/"
Changelog = "https://github.com/ravikings/byoai-runtime/blob/main/CHANGELOG.md"
Issues = "https://github.com/ravikings/byoai-runtime/issues"

[tool.hatch.version]
path = "src/byoai/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/byoai"]
# The built console (web/ -> src/byoai/console_static/) is git-ignored, and
# hatchling honours VCS ignores by default, so it needs listing as a build
# artifact to make it into the wheel. Absent (no front-end build), this is a
# no-op and the wheel still builds.
artifacts = ["src/byoai/console_static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# importlib import mode + explicit pythonpath so the local `tests` package
# wins over any stray `tests` dist installed in site-packages (which otherwise
# shadows `tests.conftest` and breaks collection).
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: `Depends(...)` in argument defaults is the standard FastAPI idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Copied byte-for-byte from coriqo-seal-verifier's reference reader; a test
# fails if it drifts, so it is not reformatted here.
"src/byoai/recorder/mandate_format.py" = ["E501"]
