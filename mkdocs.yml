site_name: ByoAI Runtime
site_description: The AI execution runtime for Python. Bring your own infrastructure; ByoAI brings the runtime.
site_url: https://coriqo.github.io/byoai-runtime/
repo_url: https://github.com/coriqo/byoai-runtime
repo_name: coriqo/byoai-runtime
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
      - FastAPI integration: guides/fastapi.md
      - Flask integration: guides/flask.md
      - Robyn integration: guides/robyn.md
      - MCP integration: guides/mcp.md
      - Caching: guides/caching.md
      - Semantic (intent) caching: guides/semantic-cache.md
      - Vector stores & filters: guides/vector-stores.md
      - Provider routing & fallback: guides/providers.md
      - Background workers: guides/workers.md
      - Telemetry (OpenTelemetry): guides/telemetry.md
      - Mandate enforcement: guides/mandate-enforcement.md
      - Testing: guides/testing.md
  - Shield zero-touch deployment (MDM): msp-zero-touch.md
  - Shield Sync protocol: shield-sync-protocol.md
  - Recorder seal format: seal-format.md
  - Shield event envelope: shield-event-envelope.md
  - Shield signature files: shield-signatures.md
  - API Reference: reference/api.md
  - Configuration Reference: https://github.com/coriqo/byoai-runtime/blob/main/CONFIGURATION.md
  - Changelog: https://github.com/coriqo/byoai-runtime/blob/main/CHANGELOG.md
  - Contributing: https://github.com/coriqo/byoai-runtime/blob/main/CONTRIBUTING.md
